name: Build APK
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack newest project zip
        run: |
          ZIP=$(for f in apk_project*.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using: $ZIP"
          unzip -q "$ZIP" -d proj
          grep -o "APP_VERSION='[^']*'" proj/www/index.html
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        working-directory: proj
        run: npm install
      - name: Bundle Excel library
        working-directory: proj
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js
      - name: Add Android
        working-directory: proj
        run: npx cap add android
      - name: Native print and save bridge
        working-directory: proj
        run: cp ci/MainActivity.java android/app/src/main/java/com/remas/attendance/MainActivity.java
      - name: App icons
        working-directory: proj
        continue-on-error: true
        run: npm install --no-save @capacitor/assets && npx capacitor-assets generate --android
      - name: Sync
        working-directory: proj
        run: npx cap sync android
      - name: Stable signing key
        working-directory: proj
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - name: Build
        working-directory: proj/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
